spring.application.name=portfolio-tracker-frontend

# The frontend runs on its own port; the backend is a separate application.
server.port=8081

# Where the REST API lives. Override if the backend runs elsewhere, e.g.
#   --app.backend.base-url=http://localhost:8090/v1
app.backend.base-url=http://localhost:8080/v1
app.backend.timeout-seconds=20

# The user whose data this UI shows. The course project has no login, so the
# demo user seeded by the backend is used.
app.backend.user-id=1

vaadin.launch-browser=false
logging.level.com.kodilla.portfolio.ui=INFO
